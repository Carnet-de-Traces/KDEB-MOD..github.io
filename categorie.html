<!doctype html>
<!--
=======================================================================
 FICHIER : categorie.html  =  PAGE D'UNE CATÉGORIE
 Une seule page pour les deux catégories :
   categorie.html?c=nord    > Traces du Nord
   categorie.html?c=france  > Traces ailleurs en France
 On peut ajouter des filtres déjà choisis : &a=velo (ou rando), &d=journee
 (ou plusieurs-jours). C'est ce que font les liens du menu.
 Le contenu (titre, compteurs, carte, filtres, vignettes) est ajouté par
 assets/categorie.js. Le grand titre et le texte de chaque catégorie se
 modifient dans CATEGORIES, en haut de assets/entete.js.
=======================================================================
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traces du Nord et ailleurs en France - Carnet de traces</title>  <!-- remplacé par le nom de la catégorie -->
<meta name="description" content="Parcours à vélo et randonnées testés sur le terrain : carte, filtres et traces GPX à télécharger.">
<!-- Icône de l'onglet (favicon) et de l'écran d'accueil du téléphone -->
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<!-- Aperçu quand le lien est partagé (WhatsApp, Facebook, Instagram, Messages...) :
     titre, texte et image (assets/partage.jpg, 1200 x 630 px). Les adresses doivent être complètes. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Carnet de traces">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="Traces du Nord et ailleurs en France - Carnet de traces">
<meta property="og:description" content="Parcours à vélo et randonnées testés sur le terrain : carte, filtres et traces GPX à télécharger.">
<meta property="og:url" content="https://carnet-de-traces.github.io/KDEB-MOD..github.io/categorie.html">
<meta property="og:image" content="https://carnet-de-traces.github.io/KDEB-MOD..github.io/assets/partage.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Crête du Jura au-dessus du Pays de Gex">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/polices/polices.css?v=20261026b">
<link rel="stylesheet" href="assets/leaflet/leaflet.css">
<!-- VERSION DES FICHIERS : même numéro que dans les autres pages HTML -->
<link rel="stylesheet" href="assets/style.css?v=20261026b">
</head>
<!-- "editorial" = style magazine (règles en fin de style.css) -->
<body class="accueil editorial page-categorie">

<!-- ===== BANDEAU : nom de la catégorie, grand titre, texte, compteurs ===== -->
<section class="hero hero-accueil">
  <div class="fond" id="fond"></div>
  <div class="contenu">
    <div class="etiquettes-lieu"><span class="cat" id="etiquette"></span></div>
    <h1 id="titre"></h1>
    <p class="chapeau" id="chapo"></p>
    <div class="compteurs" id="compteurs"></div>
  </div>
</section>

<!-- ===== FILTRES + CARTE des traces de la catégorie ===== -->
<section class="bloc-carte-accueil">
  <div class="contenu filtres-accueil" id="filtres-activite"></div>                    <!-- Vélo / Randonnée -->
  <div class="contenu filtres-accueil filtres-distance" id="filtres-pratique"></div>   <!-- Route / Gravel / VTT -->
  <div class="contenu filtres-accueil filtres-distance" id="filtres-duree"></div>      <!-- À la journée / Plusieurs jours -->
  <div class="contenu filtres-accueil filtres-distance" id="filtres-distance"></div>   <!-- distances -->
  <div id="carte-globale"></div>
</section>

<!-- ===== VIGNETTES DES TRACES (celles qui correspondent aux filtres) ===== -->
<main class="contenu">
  <div class="sous-rubrique"><h3>Les traces <span class="mono" id="nb-visibles"></span></h3></div>
  <div class="grille grille-courte" id="fiches"></div>
  <p class="bientot" id="aucune" hidden>Pas encore de trace pour ces filtres : de nouvelles arrivent bientôt.</p>
</main>

<script src="assets/leaflet/leaflet.js"></script>
<script src="assets/entete.js?v=20261026b"></script>
<script src="assets/categorie.js?v=20261026b"></script>
</body>
</html>
