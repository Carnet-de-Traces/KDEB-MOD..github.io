<!doctype html>
<!--
=======================================================================
 FICHIER : index.html  =  PAGE D'ACCUEIL du site
 Elle contient seulement la STRUCTURE de la page (des "boîtes" vides).
 Le contenu (compteurs, carte, vignettes) est ajouté par assets/accueil.js.

 À SAVOIR :
 - Un texte entre <!- - et - -> (comme celui-ci) est un commentaire :
   il n'apparaît pas sur le site.
 - Les textes que tu peux changer directement ici : le titre de l'onglet
   (<title>), la description pour Google, le grand titre et la phrase
   d'accroche. Les liens du pied de page sont dans assets/entete.js.
=======================================================================
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Titre affiché dans l'onglet du navigateur et dans Google -->
<title>Carnet de traces - parcours à vélo et à pied</title>
<!-- Description affichée sous le titre dans les résultats Google -->
<meta name="description" content="Parcours à vélo et randonnées, à la journée ou sur plusieurs jours : carte, profil, points d'intérêt et GPX à télécharger.">

<!-- Polices de caractères (Newsreader pour les titres, Barlow Condensed pour les étiquettes,
     IBM Plex pour le texte et les chiffres), hébergées sur le site (assets/polices) -->
<!-- Icône de l'onglet (favicon) et de l'écran d'accueil du téléphone -->
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<!-- Aperçu quand le lien est partagé (WhatsApp, Facebook, Instagram, Messages...) :
     titre, texte et image (assets/partage.jpg, 1200 x 630 px). Les adresses doivent être complètes. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Carnet de traces">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="Carnet de traces - parcours à vélo et à pied">
<meta property="og:description" content="Parcours à vélo et randonnées, à la journée ou sur plusieurs jours : carte, profil, points d'intérêt et GPX à télécharger.">
<meta property="og:url" content="https://carnet-de-traces.github.io/KDEB-MOD..github.io/">
<meta property="og:image" content="https://carnet-de-traces.github.io/KDEB-MOD..github.io/assets/partage.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Crête du Jura au-dessus du Pays de Gex">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/polices/polices.css?v=20261026a">
<!-- Styles de la carte (Leaflet), puis les styles du site (couleurs, tailles...) -->
<link rel="stylesheet" href="assets/leaflet/leaflet.css">
<!-- VERSION DES FICHIERS : le "?v=..." force les navigateurs à recharger le style et les
     scripts après une mise à jour. Change ce numéro (ex. la date du jour) quand tu modifies
     style.css ou un fichier .js du dossier assets, ici ET dans l'autre page HTML. -->
<link rel="stylesheet" href="assets/style.css?v=20261026a">
</head>
<!-- "editorial" = style magazine de l'accueil (règles en fin de style.css) -->
<body class="accueil editorial">

<!-- L'en-tête (logo + menus) est ajouté ici automatiquement par assets/entete.js -->

<!-- ===== BANDEAU D'OUVERTURE ===== -->
<section class="hero hero-accueil">
  <div class="fond" id="fond"></div>  <!-- fond en courbes de niveau, dessiné par accueil.js -->
  <div class="contenu">
    <div class="etiquettes-lieu"><span class="cat">Traces du Nord · Ailleurs en France</span></div>
    <!-- Grand titre : la partie entre <em> et </em> s'affiche en orange -->
    <h1>Des parcours à vélo et à pied, <em>prêts à partir.</em></h1>
    <!-- Phrase d'accroche sous le titre -->
    <p class="chapeau">Chaque itinéraire est testé sur le terrain : carte, profil, points d'eau, ravitaillements et trace GPX à télécharger.</p>
    <div class="compteurs" id="compteurs"></div>  <!-- compteurs remplis par accueil.js -->
  </div>
</section>

<!-- ===== GRANDE CARTE DE TOUS LES PARCOURS ===== -->
<section class="bloc-carte-accueil">
  <div class="contenu filtres-accueil" id="filtres"></div>  <!-- boutons Tous / Vélo / Randonnée -->
  <div id="carte-globale"></div>                            <!-- la carte -->
</section>

<!-- ===== LES DEUX CATÉGORIES (remplies par accueil.js) : chacune ouvre sa page ===== -->
<main class="contenu" id="rubriques"></main>

<!-- Le pied de page est ajouté automatiquement par assets/entete.js
     (ses liens se modifient dans PIED_DE_PAGE, en haut de ce fichier). -->

<!-- Programmes de la page, dans cet ordre : carte (Leaflet), en-tête commun, accueil -->
<script src="assets/leaflet/leaflet.js"></script>
<script src="assets/entete.js?v=20261026a"></script>
<script src="assets/accueil.js?v=20261026a"></script>
</body>
</html>
